name: Native build
# Adapted from AdrianAbbas/Worldbuilder (docs/DEVLOG.md, Milestone 0). Commits whose
# message contains [skip ci] do not run.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  JUCE_COMMIT: ea77444750de45e036e0279bb0291144bf8e3688 # JUCE 8.0.16, as in CMakeLists.txt
jobs:
  macos:
    runs-on: macos-15
    # 2026-11-12: 120 (was 90): Developer ID signing and two notarisations join the job.
    timeout-minutes: 120
    outputs:
      customer: ${{ steps.customer.outputs.name }}
    env:
      APPLE_TEAM_ID: YYZP4W7G7D # LJP Records Inc. (Windward Audio); not a secret
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and Rosetta
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      # JUCE is fetched once and kept (the configure step otherwise clones its whole history).
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-universal
          max-size: 2G
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings and effect captures live in the private AdrianAbbas/Samples
      # repository, read with the SAMPLES_TOKEN secret: the recordings are prepared into
      # build/samples (shipped in every bundle), the captures into build/captures (embedded).
      # Without the secret the instruments play their synthesised stand-ins (a warning says so).
      - name: Fetch and prepare the recordings and the effect captures (private repository)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" build/samples build/captures
      # 2026-11-06: the woodwind layers' samples, from the free CC0 library VSCO 2 Community Edition
      # (docs/LICENSES), fetched from its official source at tag 1.1.0 and cached; never committed.
      # Without them the woodwind layers play their synthesised stand-ins (a warning says so).
      - name: Woodwind samples cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsco-woodwinds
          key: vsco2ce-1.1.0-28092772-woodwinds-v1
      - name: Fetch and prepare the CC0 woodwind samples (official source, licence checked, cached)
        run: bash scripts/ci-fetch-woodwinds.sh "${{ runner.temp }}/vsco-woodwinds" build/samples
      - name: Configure (universal arm64 + x86_64, macOS 10.15+)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DJUCE_PATH="${{ runner.temp }}/juce"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite runs in the Linux job. Here a short smoke group checks
      # each slice of the universal binary.
      - name: Smoke test (arm64)
        run: /usr/bin/arch -arm64 build/LiminalTests_artefacts/Release/LiminalTests --only smoke,parameters,recorded,woodwind
      - name: Smoke test (x86_64 under Rosetta)
        run: /usr/bin/arch -x86_64 build/LiminalTests_artefacts/Release/LiminalTests --only smoke,parameters
      # VACANCY FX (2026-11-06), the effect built from the same sources: its own suite.
      - name: VACANCY FX smoke test (arm64 and x86_64 under Rosetta)
        run: |
          /usr/bin/arch -arm64 build/TapewornFXTests_artefacts/Release/TapewornFXTests --only smoke,parameters,latency,mono
          /usr/bin/arch -x86_64 build/TapewornFXTests_artefacts/Release/TapewornFXTests --only smoke,parameters,latency
      - name: Universal binary and Info.plist gate (instrument and effect)
        run: bash scripts/ci-check-bundles.sh build/LIMINAL_artefacts/Release build/TapewornFX_artefacts/Release
      # Developer ID signing and notarisation (docs/RELEASING.md): only for pushes to main and manual
      # runs, never for pull requests or forks, and only when all seven secrets exist. Otherwise the
      # build is signed ad hoc as before (scripts/package-mac.sh) and VACANCY.pkg is built unsigned
      # for the install test only. Secrets reach only the steps that need them and are never printed.
      - name: Decide whether this run signs with Developer ID
        id: signing
        env:
          ELIGIBLE: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && !github.event.repository.fork }}
          HAVE_MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 != '' }}
          HAVE_MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD != '' }}
          HAVE_MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 != '' }}
          HAVE_MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD != '' }}
          HAVE_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAVE_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAVE_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          missing=""
          for name in MACOS_APP_CERT_P12 MACOS_APP_CERT_PASSWORD MACOS_INSTALLER_CERT_P12 MACOS_INSTALLER_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            have="HAVE_$name"
            [[ "${!have}" == true ]] || missing="$missing $name"
          done
          if [[ "$ELIGIBLE" != true ]]; then
            echo "::notice title=Ad-hoc build::Developer ID signing and notarisation run only for pushes to main and manual runs ($GITHUB_EVENT_NAME on $GITHUB_REF): this build is signed ad hoc and VACANCY.pkg is unsigned (install test only)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$missing" ]]; then
            echo "::notice title=Ad-hoc build::Developer ID signing skipped, these secrets are missing:$missing. This build is signed ad hoc and VACANCY.pkg is unsigned (install test only). See docs/RELEASING.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Developer ID signing and notarisation enabled (team $APPLE_TEAM_ID)."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import the Developer ID certificates and the G2 intermediate into a temporary keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash scripts/ci-signing-setup.sh
      - name: Sign both plug-ins with Developer ID (hardened runtime, secure timestamp, no entitlements)
        if: steps.signing.outputs.enabled == 'true'
        run: >
          bash scripts/sign-mac.sh
          build/LIMINAL_artefacts/Release/AU/VACANCY.component build/LIMINAL_artefacts/Release/VST3/VACANCY.vst3
          "build/TapewornFX_artefacts/Release/AU/VACANCY FX.component" "build/TapewornFX_artefacts/Release/VST3/VACANCY FX.vst3"
      # Bundles already signed with Developer ID keep their signature; everything else is signed ad hoc.
      - name: Sign, verify and package (both plug-ins)
        run: bash scripts/package-mac.sh build/LIMINAL_artefacts/Release dist build/TapewornFX_artefacts/Release
      - name: Notarise the zip, staple the tickets to the four bundles and re-package
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          bash scripts/notarize-mac.sh dist/VACANCY-macOS-Universal.zip build/ci-logs/notary
          for bundle in build/LIMINAL_artefacts/Release/AU/VACANCY.component build/LIMINAL_artefacts/Release/VST3/VACANCY.vst3 \
                        "build/TapewornFX_artefacts/Release/AU/VACANCY FX.component" "build/TapewornFX_artefacts/Release/VST3/VACANCY FX.vst3"; do
            stapled=0
            for attempt in 1 2 3 4; do
              if xcrun stapler staple "$bundle"; then stapled=1; break; fi
              sleep $((attempt * 15))
            done
            [[ $stapled == 1 ]] || echo "::warning::could not staple a ticket to $bundle (Gatekeeper still finds the ticket online)"
          done
          bash scripts/package-mac.sh build/LIMINAL_artefacts/Release dist build/TapewornFX_artefacts/Release
      - name: Build the installer package VACANCY.pkg (productbuild, Developer ID Installer when signing)
        run: bash scripts/build-pkg.sh build/LIMINAL_artefacts/Release build/TapewornFX_artefacts/Release dist/VACANCY.pkg
      - name: Notarise VACANCY.pkg and staple the ticket
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/notarize-mac.sh --staple dist/VACANCY.pkg build/ci-logs/notary
      - name: Verify signatures, notarisation and Gatekeeper (four bundles and the installer)
        if: steps.signing.outputs.enabled == 'true'
        run: >
          bash scripts/ci-verify-signing.sh dist/VACANCY.pkg
          build/LIMINAL_artefacts/Release/AU/VACANCY.component build/LIMINAL_artefacts/Release/VST3/VACANCY.vst3
          "build/TapewornFX_artefacts/Release/AU/VACANCY FX.component" "build/TapewornFX_artefacts/Release/VST3/VACANCY FX.vst3"
      - name: Build AU host harnesses (instrument and effect)
        run: bash scripts/build-au-harness.sh build/LiminalAUHarness
      - name: Install a quarantined download with install-mac.sh, then auval and harnesses for both plug-ins (arm64 + x86_64)
        run: bash scripts/ci-user-install-test.sh dist/VACANCY-macOS-Universal.zip build/LiminalAUHarness build/ci-logs
      - name: Install VACANCY.pkg on the runner, then auval and harnesses on the installed copies (arm64 + x86_64)
        run: bash scripts/ci-pkg-install-test.sh ${{ steps.signing.outputs.enabled == 'true' && '--notarized' || '' }} dist/VACANCY.pkg build/LiminalAUHarness build/ci-logs/pkg
      # Annotations are readable through the REST API; GitHub keeps at most 10 per step.
      - name: Publish install and arm64 harness logs as annotations
        if: always()
        run: bash scripts/ci-annotate.sh --condense build/ci-logs/quarantine.txt build/ci-logs/install-mac.txt build/ci-logs/harness-arm64-*.txt build/ci-logs/harness-fx-arm64-*.txt
      - name: Publish x86_64 harness and auval logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/auval-*.txt; do
            if [[ -f "$f" ]]; then tail -25 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/harness-x86_64-*.txt build/ci-logs/harness-fx-x86_64-*.txt build/ci-logs/control-*.txt build/ci-logs/crashes.txt build/ci-logs/auval-*.txt.tail
      - name: Upload the developer package (bundles and install scripts, for testing only; only when every check passed)
        uses: actions/upload-artifact@v4
        with:
          name: VACANCY-dev-macOS
          path: dist/VACANCY-macOS-Universal.zip
          if-no-files-found: error
      - name: Publish VACANCY.pkg install logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/pkg/pkg-auval-*.txt; do
            if [[ -f "$f" ]]; then tail -12 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/pkg/pkg-gatekeeper.txt build/ci-logs/pkg/pkg-scripts.txt build/ci-logs/pkg/pkg-registry.txt build/ci-logs/pkg/pkg-crashes.txt build/ci-logs/pkg/pkg-auval-*.txt.tail
      # Customer download (docs/INSTALLER_STANDARD.md): VACANCY-<version>-macOS with only the signed,
      # notarised "VACANCY Installer.pkg" and "VACANCY - Read Me.pdf". Ad-hoc runs produce none.
      - name: Stage the customer package (VACANCY Installer.pkg and the Read Me)
        id: customer
        run: |
          name="VACANCY-$(python3 -c 'import json; print(json.load(open("installer/product.json"))["version"])')-macOS"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.signing.outputs.enabled }}" == true ]]; then
            bash scripts/package-mac.sh --customer dist/VACANCY.pkg dist
          else
            echo "::notice title=No customer package::This run was signed ad hoc, so VACANCY.pkg is unsigned and the customer artifact $name was not produced. Only the developer artifact VACANCY-dev-macOS is available."
          fi
      - name: Upload the customer package (signed runs only, when every check passed)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.customer.outputs.name }}
          path: dist/${{ steps.customer.outputs.name }}/
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VACANCY-macOS-diagnostics
          path: |
            build/ci-logs/
          if-no-files-found: warn
      # Always last: the temporary keychain and the API key file are deleted whatever happened.
      - name: Delete the temporary signing keychain
        if: always()
        run: bash scripts/ci-signing-cleanup.sh
  linux:
    runs-on: ubuntu-24.04
    # 2026-11-06: 90 (as the macOS job): VACANCY FX's suite and listening render join the instrument's.
    timeout-minutes: 90
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 1G
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings and effect captures live in the private AdrianAbbas/Samples
      # repository, read with the SAMPLES_TOKEN secret: the recordings are prepared into
      # build/samples (shipped in every bundle), the captures into build/captures (embedded).
      # Without the secret the instruments play their synthesised stand-ins (a warning says so).
      - name: Fetch and prepare the recordings and the effect captures (private repository)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" build/samples build/captures
      # 2026-11-06: the woodwind layers' samples, from the free CC0 library VSCO 2 Community Edition
      # (docs/LICENSES), fetched from its official source at tag 1.1.0 and cached; never committed.
      # Without them the woodwind layers play their synthesised stand-ins (a warning says so).
      - name: Woodwind samples cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsco-woodwinds
          key: vsco2ce-1.1.0-28092772-woodwinds-v1
      - name: Fetch and prepare the CC0 woodwind samples (official source, licence checked, cached)
        run: bash scripts/ci-fetch-woodwinds.sh "${{ runner.temp }}/vsco-woodwinds" build/samples
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ runner.temp }}/juce"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite in parallel shards, then the CPU-measuring group alone.
      - name: Processor tests (full suite)
        run: bash scripts/run-tests-parallel.sh build/LiminalTests_artefacts/Release/LiminalTests build/test-logs
      # VACANCY FX: its full suite (strength on guitar, vocal and a full mix in every room, level match,
      # clicks, latency, real-time safety, presets, the editor), then its listening render.
      - name: VACANCY FX processor tests (full suite)
        run: |
          set -o pipefail
          build/TapewornFXTests_artefacts/Release/TapewornFXTests --snapshot build/test-logs/fx-editor.png | tee build/test-logs/fx-tests.txt
      - name: VACANCY FX listening render (the same guitar, vocal and mix phrase dry and through six rooms at LIMINALITY 0, 50 and 100 percent, with cue sheet)
        run: build/TapewornFXTests_artefacts/Release/TapewornFXTests --render build/test-logs/fx-listening
      - name: Listening render (each instrument, in the corridor, then dry)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render build/test-logs/m1b-instruments.wav
      - name: "Listening render (one piano phrase through all ten rooms, a shuffled blind version with cue sheet, each room bed alone for 60 s, all 30 Characters)"
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-places build/test-logs/u2-rooms.wav
      - name: Listening render (pedal captures, one piano phrase through all ten rooms, before and after, with an A/B file and cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-captures build/test-logs/captures-rooms.wav
      - name: Listening render (Liminality, one piano phrase at 0, 40 and 100 percent, dry and in three rooms, with cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-liminality build/test-logs/liminality-piano.wav
      - name: Listening render (the recorded instruments, one piano phrase and chords on each, dry, in three rooms, at Liminality 0, 50 and 100 percent, with cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-recorded build/test-logs/recorded-instruments.wav
      - name: Listening render (the instrument library, the same phrase on all twenty instruments, dry and in three rooms, with cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-library build/test-logs/library-instruments.flac
      - name: Listening render (real woodwinds, each changed instrument before and after, dry and in three rooms, with cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-woodwinds build/test-logs/woodwinds.flac
      # 2026-11-05 patch notes: the four-part test piece on the seven instruments they name, after the patch
      # and before it (the code before, 13351aa, built with today's render: scripts/build-before.sh).
      - name: Listening render (the four-part test piece on seven instruments, after the patch notes)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-piece build/test-logs/piece-after.flac
      - name: Build the code before the patch notes, for the before render
        run: bash scripts/build-before.sh 13351aa58e15bc454eb9cfddaed1a5dfc3253988 "${{ runner.temp }}/before-src" "${{ runner.temp }}/before-build" "${{ runner.temp }}/juce" build/samples build/captures
      - name: Listening render (the four-part test piece, before the patch notes)
        run: |
          "${{ runner.temp }}/before-build/LiminalTests_artefacts/Release/LiminalTests" --render-piece build/test-logs/piece-before.flac
          "${{ runner.temp }}/before-build/LiminalTests_artefacts/Release/LiminalTests" --probe-treatment | tee build/test-logs/treatment-before.txt
          build/LiminalTests_artefacts/Release/LiminalTests --probe-treatment | tee build/test-logs/treatment-after.txt
      - name: Upload test logs, editor snapshot and listening render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VACANCY-linux-test-logs
          path: build/test-logs/
          if-no-files-found: warn
  release:
    # Tagged commits (v*) publish the customer package as a GitHub Release: VACANCY-<version>-macOS.zip
    # with only "VACANCY Installer.pkg" and "VACANCY - Read Me.pdf". It needs a signed run on the tag (docs/RELEASING.md).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.macos.outputs.customer }}
          path: ${{ needs.macos.outputs.customer }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOMER: ${{ needs.macos.outputs.customer }}
        run: |
          if [[ ! -f "$CUSTOMER/VACANCY Installer.pkg" ]]; then
            echo "::error::no signed VACANCY Installer.pkg in this run (ad-hoc build), so there is no customer package to release"
            exit 1
          fi
          (cd "$CUSTOMER" && zip -X "../$CUSTOMER.zip" "VACANCY Installer.pkg" "VACANCY - Read Me.pdf")
          gh release create "$GITHUB_REF_NAME" "$CUSTOMER.zip" --repo "$GITHUB_REPOSITORY" --title "VACANCY $GITHUB_REF_NAME" --generate-notes
