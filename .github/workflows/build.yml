name: Native build
# Adapted from AdrianAbbas/Worldbuilder (docs/DEVLOG.md, Milestone 0). Commits whose
# message contains [skip ci] do not run.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  JUCE_COMMIT: ea77444750de45e036e0279bb0291144bf8e3688 # JUCE 8.0.16, as in CMakeLists.txt
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # The optional Developer ID path runs only when these secrets exist.
      HAS_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATE != '' }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and Rosetta
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      # JUCE is fetched once and kept (the configure step otherwise clones its whole history).
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-universal
          max-size: 2G
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings and effect captures live in the private AdrianAbbas/Samples
      # repository, read with the SAMPLES_TOKEN secret: the recordings are prepared into
      # build/samples (shipped in every bundle), the captures into build/captures (embedded).
      # Without the secret the instruments play their synthesised stand-ins (a warning says so).
      - name: Fetch and prepare the recordings and the effect captures (private repository)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" build/samples build/captures
      # 2026-11-06: the woodwind layers' samples, from the free CC0 library VSCO 2 Community Edition
      # (docs/LICENSES), fetched from its official source at tag 1.1.0 and cached; never committed.
      # Without them the woodwind layers play their synthesised stand-ins (a warning says so).
      - name: Woodwind samples cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsco-woodwinds
          key: vsco2ce-1.1.0-28092772-woodwinds-v1
      - name: Fetch and prepare the CC0 woodwind samples (official source, licence checked, cached)
        run: bash scripts/ci-fetch-woodwinds.sh "${{ runner.temp }}/vsco-woodwinds" build/samples
      - name: Configure (universal arm64 + x86_64, macOS 10.15+)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DJUCE_PATH="${{ runner.temp }}/juce"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite runs in the Linux job. Here a short smoke group checks
      # each slice of the universal binary.
      - name: Smoke test (arm64)
        run: /usr/bin/arch -arm64 build/LiminalTests_artefacts/Release/LiminalTests --only smoke,parameters,recorded,woodwind
      - name: Smoke test (x86_64 under Rosetta)
        run: /usr/bin/arch -x86_64 build/LiminalTests_artefacts/Release/LiminalTests --only smoke,parameters
      # TAPEWORN FX (2026-11-06), the effect built from the same sources: its own suite.
      - name: TAPEWORN FX smoke test (arm64 and x86_64 under Rosetta)
        run: |
          /usr/bin/arch -arm64 build/TapewornFXTests_artefacts/Release/TapewornFXTests --only smoke,parameters,latency,mono
          /usr/bin/arch -x86_64 build/TapewornFXTests_artefacts/Release/TapewornFXTests --only smoke,parameters,latency
      - name: Universal binary and Info.plist gate (instrument and effect)
        run: bash scripts/ci-check-bundles.sh build/LIMINAL_artefacts/Release build/TapewornFX_artefacts/Release
      - name: Developer ID signing and notarisation (optional, untested)
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash scripts/ci-developer-id.sh build/LIMINAL_artefacts/Release build/TapewornFX_artefacts/Release
      - name: Sign, verify and package (both plug-ins)
        run: bash scripts/package-mac.sh build/LIMINAL_artefacts/Release dist build/TapewornFX_artefacts/Release
      - name: Build AU host harnesses (instrument and effect)
        run: bash scripts/build-au-harness.sh build/LiminalAUHarness
      - name: Install a quarantined download with install-mac.sh, then auval and harnesses for both plug-ins (arm64 + x86_64)
        run: bash scripts/ci-user-install-test.sh dist/TAPEWORN-macOS-Universal.zip build/LiminalAUHarness build/ci-logs
      # Annotations are readable through the REST API; GitHub keeps at most 10 per step.
      - name: Publish install and arm64 harness logs as annotations
        if: always()
        run: bash scripts/ci-annotate.sh --condense build/ci-logs/quarantine.txt build/ci-logs/install-mac.txt build/ci-logs/harness-arm64-*.txt build/ci-logs/harness-fx-arm64-*.txt
      - name: Publish x86_64 harness and auval logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/auval-*.txt; do
            if [[ -f "$f" ]]; then tail -25 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/harness-x86_64-*.txt build/ci-logs/harness-fx-x86_64-*.txt build/ci-logs/control-*.txt build/ci-logs/crashes.txt build/ci-logs/auval-*.txt.tail
      - name: Upload installable package (only when every check passed)
        uses: actions/upload-artifact@v4
        with:
          name: TAPEWORN-macOS-Universal
          path: dist/TAPEWORN-macOS-Universal.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAPEWORN-macOS-diagnostics
          path: |
            build/ci-logs/
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-24.04
    # 2026-11-06: 90 (as the macOS job): TAPEWORN FX's suite and listening render join the instrument's.
    timeout-minutes: 90
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 1G
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings and effect captures live in the private AdrianAbbas/Samples
      # repository, read with the SAMPLES_TOKEN secret: the recordings are prepared into
      # build/samples (shipped in every bundle), the captures into build/captures (embedded).
      # Without the secret the instruments play their synthesised stand-ins (a warning says so).
      - name: Fetch and prepare the recordings and the effect captures (private repository)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" build/samples build/captures
      # 2026-11-06: the woodwind layers' samples, from the free CC0 library VSCO 2 Community Edition
      # (docs/LICENSES), fetched from its official source at tag 1.1.0 and cached; never committed.
      # Without them the woodwind layers play their synthesised stand-ins (a warning says so).
      - name: Woodwind samples cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsco-woodwinds
          key: vsco2ce-1.1.0-28092772-woodwinds-v1
      - name: Fetch and prepare the CC0 woodwind samples (official source, licence checked, cached)
        run: bash scripts/ci-fetch-woodwinds.sh "${{ runner.temp }}/vsco-woodwinds" build/samples
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ runner.temp }}/juce"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite in parallel shards, then the CPU-measuring group alone.
      - name: Processor tests (full suite)
        run: bash scripts/run-tests-parallel.sh build/LiminalTests_artefacts/Release/LiminalTests build/test-logs
      # TAPEWORN FX: its full suite (strength on guitar, vocal and a full mix in every room, level match,
      # clicks, latency, real-time safety, presets, the editor), then its listening render.
      - name: TAPEWORN FX processor tests (full suite)
        run: |
          set -o pipefail
          build/TapewornFXTests_artefacts/Release/TapewornFXTests --snapshot build/test-logs/fx-editor.png | tee build/test-logs/fx-tests.txt
      - name: TAPEWORN FX listening render (the same guitar, vocal and mix phrase dry and through six rooms at LIMINALITY 0, 50 and 100 percent, with cue sheet)
        run: build/TapewornFXTests_artefacts/Release/TapewornFXTests --render build/test-logs/fx-listening
      - name: Listening render (each instrument, in the corridor, then dry)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render build/test-logs/m1b-instruments.wav
      - name: "Listening render (one piano phrase through all ten rooms, a shuffled blind version with cue sheet, each room bed alone for 60 s, all 30 Characters)"
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-places build/test-logs/u2-rooms.wav
      - name: Listening render (pedal captures, one piano phrase through all ten rooms, before and after, with an A/B file and cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-captures build/test-logs/captures-rooms.wav
      - name: Listening render (Liminality, one piano phrase at 0, 40 and 100 percent, dry and in three rooms, with cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-liminality build/test-logs/liminality-piano.wav
      - name: Listening render (the recorded instruments, one piano phrase and chords on each, dry, in three rooms, at Liminality 0, 50 and 100 percent, with cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-recorded build/test-logs/recorded-instruments.wav
      - name: Listening render (the instrument library, the same phrase on all twenty instruments, dry and in three rooms, with cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-library build/test-logs/library-instruments.flac
      - name: Listening render (real woodwinds, each changed instrument before and after, dry and in three rooms, with cue sheet)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-woodwinds build/test-logs/woodwinds.flac
      # 2026-11-05 patch notes: the four-part test piece on the seven instruments they name, after the patch
      # and before it (the code before, 13351aa, built with today's render: scripts/build-before.sh).
      - name: Listening render (the four-part test piece on seven instruments, after the patch notes)
        run: build/LiminalTests_artefacts/Release/LiminalTests --render-piece build/test-logs/piece-after.flac
      - name: Build the code before the patch notes, for the before render
        run: bash scripts/build-before.sh 13351aa58e15bc454eb9cfddaed1a5dfc3253988 "${{ runner.temp }}/before-src" "${{ runner.temp }}/before-build" "${{ runner.temp }}/juce" build/samples build/captures
      - name: Listening render (the four-part test piece, before the patch notes)
        run: |
          "${{ runner.temp }}/before-build/LiminalTests_artefacts/Release/LiminalTests" --render-piece build/test-logs/piece-before.flac
          "${{ runner.temp }}/before-build/LiminalTests_artefacts/Release/LiminalTests" --probe-treatment | tee build/test-logs/treatment-before.txt
          build/LiminalTests_artefacts/Release/LiminalTests --probe-treatment | tee build/test-logs/treatment-after.txt
      - name: Upload test logs, editor snapshot and listening render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAPEWORN-linux-test-logs
          path: build/test-logs/
          if-no-files-found: warn
  release:
    # Tagged commits (v*) publish the same package as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TAPEWORN-macOS-Universal
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" TAPEWORN-macOS-Universal.zip --repo "$GITHUB_REPOSITORY" --title "TAPEWORN $GITHUB_REF_NAME" --generate-notes
